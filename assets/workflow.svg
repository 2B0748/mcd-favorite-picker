<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="220" viewBox="0 0 1400 220"
     role="img" aria-label="从需求到餐单结论的四步流程">
<title>四步流程</title>
<rect width="1400" height="220" rx="20" fill="#f7f2e6"/>
<g font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif"><rect x="35" y="35" width="295" height="148" rx="15" fill="#fffdf8" stroke="#e4d4b8"/><text x="56" y="72" fill="#b7975a" font-size="17">01</text><text x="56" y="111" fill="#251b16" font-size="25" font-weight="700">说出需求</text><text x="56" y="150" fill="#88725b" font-size="16">想吃什么、在哪、几点</text><path d="M343 109h19l-5 -5m5 5l-5 5" fill="none" stroke="#b7975a" stroke-width="2"/><rect x="380" y="35" width="295" height="148" rx="15" fill="#fffdf8" stroke="#e4d4b8"/><text x="401" y="72" fill="#b7975a" font-size="17">02</text><text x="401" y="111" fill="#251b16" font-size="25" font-weight="700">算出门味</text><text x="401" y="150" fill="#88725b" font-size="16">订单去重累积偏好</text><path d="M688 109h19l-5 -5m5 5l-5 5" fill="none" stroke="#b7975a" stroke-width="2"/><rect x="725" y="35" width="295" height="148" rx="15" fill="#251b16" stroke="#e4d4b8"/><text x="746" y="72" fill="#b7975a" font-size="17">03</text><text x="746" y="111" fill="#ffc72c" font-size="25" font-weight="700">查菜单核价</text><text x="746" y="150" fill="#d4bea0" font-size="16">在售餐品与实时价</text><path d="M1033 109h19l-5 -5m5 5l-5 5" fill="none" stroke="#b7975a" stroke-width="2"/><rect x="1070" y="35" width="295" height="148" rx="15" fill="#fffdf8" stroke="#e4d4b8"/><text x="1091" y="72" fill="#b7975a" font-size="17">04</text><text x="1091" y="111" fill="#251b16" font-size="25" font-weight="700">比价出结论</text><text x="1091" y="150" fill="#88725b" font-size="16">四类方案与差价</text></g>
</svg>