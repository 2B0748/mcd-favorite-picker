<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="400" viewBox="0 0 1040 400"
     role="img" aria-label="同一门店同一目标下四种点法的价格对比">
<title>四种点法比价</title>
<rect width="1040" height="400" rx="20" fill="#f7f2e6"/>
<g font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif">
<text x="56" y="56" fill="#251b16" font-size="24" font-weight="700">同样想吃板烧，价格差了一倍</text>
<text x="56" y="84" fill="#88725b" font-size="14">同一门店 · 到店自取 · 2026-10-24 实测快照，金额单位为元</text>
<text x="56" y="125" fill="#b7975a" font-size="14">单点</text><text x="120" y="125" fill="#251b16" font-size="16">板烧鸡腿堡</text><rect x="330" y="108" width="238" height="26" rx="7" fill="#b7975a"/><text x="582" y="127" fill="#4c453f" font-size="17">¥24.00</text><text x="654" y="127" fill="#88725b" font-size="13">基准</text><text x="56" y="187" fill="#b7975a" font-size="14">套餐</text><text x="120" y="187" fill="#251b16" font-size="16">板烧鸡腿堡四件套</text><rect x="330" y="170" width="277" height="26" rx="7" fill="#ffc72c"/><text x="621" y="189" fill="#251b16" font-size="17" font-weight="700">¥28.00</text><text x="693" y="189" fill="#88725b" font-size="13">活动价 · 原价 ¥60</text><text x="56" y="249" fill="#b7975a" font-size="14">套餐</text><text x="120" y="249" fill="#251b16" font-size="16">板烧鸡腿堡三件套</text><rect x="330" y="232" width="381" height="26" rx="7" fill="#b7975a"/><text x="725" y="251" fill="#4c453f" font-size="17">¥38.50</text><text x="56" y="311" fill="#b7975a" font-size="14">自组</text><text x="120" y="311" fill="#251b16" font-size="16">堡 + 薯条 + 雪碧</text><rect x="330" y="294" width="480" height="26" rx="7" fill="#d5c9b2"/><text x="824" y="313" fill="#4c453f" font-size="17">¥48.50</text><text x="896" y="313" fill="#88725b" font-size="13">比套餐贵 ¥10</text>
<rect x="56" y="356" width="928" height="1" fill="#e4d4b8"/>
<text x="56" y="382" fill="#88725b" font-size="13">结论：四件套比单点只贵 ¥4，却多出小食与饮品；套餐比自组省 ¥10.00</text>
</g></svg>